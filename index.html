        body {

        /* --- ব্যাকগ্রাউন্ড মার্বেল বা বল অ্যানিমেশন --- */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .marble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.25;
            filter: blur(1px);
            animation: floatMarbles 12s infinite alternate ease-in-out;
        }
        .marble:nth-child(1) {
            width: 80px; height: 80px; background: #00d2ff; top: 15%; left: 10%;
            animation-duration: 10s;
        }
        .marble:nth-child(2) {
            width: 110px; height: 110px; background: #3a7bd5; top: 70%; left: 80%;
            animation-duration: 14s; animation-delay: -2s;
        }
        .marble:nth-child(3) {
            width: 65px; height: 65px; background: #00ffcc; top: 40%; left: 85%;
            animation-duration: 9s; animation-delay: -4s;
        }
        .marble:nth-child(4) {
            width: 95px; height: 95px; background: #0088ff; top: 80%; left: 15%;
            animation-duration: 16s; animation-delay: -1s;
        }
        .marble:nth-child(5) {
            width: 70px; height: 70px; background: #3a7bd5; top: 25%; left: 75%;
            animation-duration: 11s; animation-delay: -3s;
        }

        @keyframes floatMarbles {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.95); }
            100% { transform: translate(20px, 40px) scale(1.05); }
        }

        /* --- উপর থেকে নিচে নেমে আসা লাইট এফেক্ট --- */
        .falling-light {
            position: absolute;
            top: -150px;
            left: 50%;
            width: 3px;
            height: 150px;
            background: linear-gradient(to bottom, rgba(0, 210, 255, 0), #00d2ff, #ffffff);
            box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
            animation: fallLight 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        .falling-light:nth-child(7) {
            left: 20%;
            animation-duration: 5s;
            animation-delay: 1.5s;
        }
        .falling-light:nth-child(8) {
            left: 80%;
            animation-duration: 6s;
            animation-delay: 2.5s;
        }

        @keyframes fallLight {
            0% {
                top: -150px;
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            70% {
                opacity: 0.8;
            }
            100% {
                top: 100vh;
                opacity: 0;
            }
        }
        
        .container {

        .btn-download-vip:hover {

        .btn-download-vip:active, .btn-download-vip.processing {

        .status-bar {

        .status-node {

        .status-line {

        .status-line::before {

        @keyframes moveLight {

        .info-cards {

        }
    </style>
</head>

    <script>
        let downloadData = {"vip":5234};
        document.getElementById('downloadCountVip').textContent = downloadData.vip.toLocaleString();

        function incrementDownload() {
            fetch('?action=download')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('downloadCountVip').textContent = data.vip.toLocaleString();
                });

            const btn = document.getElementById('downloadBtnVip');
            btn.classList.add('processing');
            setTimeout(() => btn.classList.remove('processing'), 300);
        }

        const micToggleBtn = document.getElementById('micToggleBtn');
        let isVoiceMuted = localStorage.getItem('voiceMuted') === 'true';

        function updateMicButton() {
            if (isVoiceMuted) {
                micToggleBtn.textContent = '🔇';
                micToggleBtn.classList.add('muted');
            } else {
                micToggleBtn.textContent = '🔊';
                micToggleBtn.classList.remove('muted');
            }
        }
        updateMicButton();

        micToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            isVoiceMuted = !isVoiceMuted;
            localStorage.setItem('voiceMuted', isVoiceMuted);
            updateMicButton();

            if (isVoiceMuted) {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            } else {
                playHindiWelcome();
            }
        });

        function playHindiWelcome() {
            if (isVoiceMuted) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const welcomeText = "Hamare VPN ko istemal karne ke liye aapka bahut-bahut swagat hai. Dhanyawad!";
                const utterance = new SpeechSynthesisUtterance(welcomeText);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        let hasWelcomed = false;
        document.body.addEventListener('click', function() {
            if (!hasWelcomed && !isVoiceMuted) {
                playHindiWelcome();
                hasWelcomed = true;
            }
        }, { once: true });
    </script>
